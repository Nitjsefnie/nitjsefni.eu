name: secrets

# No path filter: a required check that never runs blocks merges.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '26 5 * * *'

permissions:
  contents: read

concurrency:
  group: secrets-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: Nitjsefnie-Actions/secret-scan@f6b0956e1bfea8aec4a4524032c3e7bbbc35b28b # v1.1.0

      - uses: Nitjsefnie-Actions/freshness@5edc2a45ff894cf49c5cc8d293bbae0af33507d4 # v1.0.0
        if: github.event_name == 'pull_request' || github.ref_name == github.event.repository.default_branch
