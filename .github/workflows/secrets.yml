name: secrets

# No path filter: a required check that never runs blocks merges.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '41 4 * * *'

permissions:
  contents: read

concurrency:
  group: secrets-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download gitleaks and verify its digest
        # Digest-verified: a URL cannot swap the binary.
        run: |
          .github/scripts/download.sh https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz gitleaks_8.30.1_linux_x64.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks_8.30.1_linux_x64.tar.gz' | sha256sum -c -
          tar xzf gitleaks_8.30.1_linux_x64.tar.gz gitleaks

      - name: Scan the tree and the history
        # Bare: the exit status is the gate.
        run: ./gitleaks detect --verbose --redact
