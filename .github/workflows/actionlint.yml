name: actionlint

# No path filter: a required check whose workflow never runs blocks merges.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: actionlint-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: true

jobs:
  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      # Fork build: stock 1.7.12 rejects the concurrency `queue` key claim.yml uses.
      NITJSEFNI_EU_ACTIONLINT_VERSION: 1.7.12-queue.3
      NITJSEFNI_EU_ACTIONLINT_REPO: Nitjsefnie-OSC/actionlint
      NITJSEFNI_EU_ACTIONLINT_SHA256: 56693f8e7182360d8ecb67cbfc39cc674cde5d1b510507fff562b158bb4fc7bc

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Check every tracked shell file
        shell: bash
        run: git ls-files -z -- '*.sh' | xargs -0 --no-run-if-empty shellcheck

      - name: Check no tracked file carries a merge-conflict marker
        run: |
          found=0
          git grep -nI -E '^(<{7}( |$)|>{7}( |$)|={7}$)' -- . || found=$?
          if [ "$found" -gt 1 ]; then
            echo "git grep exited $found, so no marker was looked for."
            exit "$found"
          fi
          if [ "$found" -eq 0 ]; then
            echo "A merge-conflict marker is committed. Resolve the conflict, rebase onto the target branch and push again."
            exit 1
          fi

      - name: Require this head to carry main's gate-defining commits
        # A base push never re-runs this pull request, so a head behind the base is refused.
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags origin "$GITHUB_BASE_REF"
          stale="$(git rev-list HEAD..FETCH_HEAD -- .github)"
          if [ -n "$stale" ]; then
            echo "This branch is missing gate-defining commits from the base branch:"
            git log --oneline HEAD..FETCH_HEAD -- .github
            echo "Rebase onto the base branch and push again."
            exit 1
          fi

      # No commit-scope check: CONTRIBUTING.md carries no scope table.

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"

      - name: Install actionlint
        run: |
          tarball="actionlint_${NITJSEFNI_EU_ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          .github/scripts/download.sh \
            "https://github.com/${NITJSEFNI_EU_ACTIONLINT_REPO}/releases/download/v${NITJSEFNI_EU_ACTIONLINT_VERSION}/${tarball}" "$tarball"
          echo "${NITJSEFNI_EU_ACTIONLINT_SHA256}  ${tarball}" | sha256sum -c -
          tar -xzf "$tarball" actionlint
          ./actionlint --version

      - name: Install zizmor
        id: install_zizmor
        run: |
          .github/scripts/retry.sh python3 -m pip install --require-hashes --only-binary=:all: -r .github/workflows/requirements.txt

      - name: actionlint
        run: ./actionlint -color .github/workflows/*.yml

      - name: zizmor
        # Runs even when actionlint is red; not after a failed install.
        if: ${{ !cancelled() && steps.install_zizmor.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: zizmor --no-progress .github/workflows/
